- defaults:
    link:
      relink: true

- clean: ['~']

- clean:
    ~/.config:
      force: true

- link:
    ~/.config/sql-lint:
      path: config/sql-lint
    ~/.config/yamllint:
      path: config/yamllint
    ~/.config/alacritty:
      path: config/alacritty
    ~/.config/nvim:
      path: config/nvim
    ~/.config/kitty:
      path: config/kitty
      force: true
    ~/.config/process-compose:
      path: config/process-compose
      force: true
    ~/.cowsay:
    ~/.dotfiles: ''
    ~/.gitconfig:
    ~/.tmux:
    ~/.tmux.conf:
    ~/.zsh:
    ~/.zshenv:
    ~/.zshrc:
      force: true

- crossplatform-link:
    "~/Library/Application Support/k9s":
      platform: darwin
      path: config/k9s
      create: true
    ~/.config/k9s:
      path: config/k9s
      platform: linux
      create: true

- shell:
    - [
        'git submodule update --init --recursive dotbot tmux/plugins/tpm config/alacritty/catppuccin dotbot-crossplatform zsh/plugins/zsh-completions',
        Installing submodules,
      ]
    - [
        'FNM_BIN="$(command -v fnm || true)"; if [ -z "$FNM_BIN" ]; then curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell; FNM_BIN="$HOME/.local/share/fnm/fnm"; fi; "$FNM_BIN" install --lts && "$FNM_BIN" default lts-latest',
        Installing fnm and Node.js,
      ]
    - [
        'if command -v tmux >/dev/null 2>&1; then ~/.tmux/plugins/tpm/bin/install_plugins; fi',
        Installing tmux plugins,
      ]
